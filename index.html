<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apadrinhamento Natal</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2&family=Poppins&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <h2 class="section-title">🎁Apadrinhamento de Natal MK🎁</h2>

  <!-- Banner topo -->
  <div class="banner">
    <div class="banner-slide active">🎄Feliz Natal!🎄</div>
    <div class="banner-slide">✨🎅🏼Participe e transforme a vida de alguém neste Natal🤶🏼✨</div>
  </div>

  <!-- Cards -->
  <div id="cards-container"></div>

  <!-- Confirmados -->
  <h2 class="section-title">Apadrinhados Confirmados</h2>
  <div id="apadrinhados-confirmados"></div>

  <!-- Modal -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3 id="modal-afilhado"></h3>
      <form id="apadrinha-form">
        <input type="text" id="padrinho-nome" placeholder="Seu nome" required>
        <input type="text" id="padrinho-whatsapp" placeholder="WhatsApp" required>
        <button type="submit" id="btn-submit">Confirmar Apadrinhamento</button>
      </form>
    </div>
  </div>

  <!-- Rodapé -->
  <div class="footer-banner">
    <div class="footer-left">
      <img src="images/banner-rodape.jpg" alt="Banner Rodapé">
      <div class="banner-text">
        <h2>Obrigado por visitar o Natal Acolhedor do MK!</h2>
        <p>Que sua visita traga sorrisos e boas energias.</p>
      </div>
    </div>
    <div class="footer-right">
      <img src="images/logo-mk.png" class="logo-footer" alt="Logo">
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
